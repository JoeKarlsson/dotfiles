# Global Vale config, managed by chezmoi (dotfiles). Vale loads it for every
# file it lints. A repo or folder .vale.ini that matches a file REPLACES these
# styles for it, so local configs list JoeKarlsson themselves.
# Styles: JoeKarlsson + JoeVideo + Letterboxd/Social vocab are symlinks into
# ~/Documents/dev/joe/vale-styles (github.com/JoeKarlsson/vale-styles);
# ai-tells, Slop, write-good, proselint and TechJargon are vendored here.
MinAlertLevel = warning

[*.md]
BasedOnStyles = JoeKarlsson

# Video scripts and their YouTube packages (the global video-script-writer skill) add
# the JoeVideo layer. A matching section replaces BasedOnStyles, so JoeKarlsson repeats.
[{**/*video*.md,**/youtube-package.md}]
BasedOnStyles = JoeKarlsson, JoeVideo, ai-tells, Slop
ai-tells.ColonUsage = warning
ai-tells.SemicolonUsage = warning
ai-tells.VerbTricolon = NO
# Joe really says "basically" and "actually" on camera, and "Remember that?" is his
# named-rule callback (video-script-writer/voice-samples/VOICE.md). Warn, don't fail.
JoeKarlsson.FillerWords = warning
ai-tells.SelfReference = warning
