# Vague social proof: claims about unnamed "teams" or a tidy count of
# "the same N things". Say "I" or name the team (Joe, 2026-10-02).
extends: existence
message: "Vague attribution: '%s'. Say what you saw firsthand, or name the team."
level: error
ignorecase: true
nonword: true
tokens:
  - '\b(?:the )?teams (?:doing|getting) (?:this|it) (?:well|right)\b'
  - "\\b(?:we'?ve|I'?ve) (?:seen|heard|watched) (?:many |lots of |a lot of )?(?:teams|companies|customers|orgs|organizations|developers)\\b"
  - '\b(?:many|most|countless|lots of) (?:teams|companies|organizations|orgs)\b'
  - '\bevery (?:team|company|customer|org) I (?:talk|talked|speak|spoke|work|worked) (?:to|with)\b'
  - '\b(?:almost |nearly )?(?:all|every one) of them (?:end up|build|do|hit)\b'
  - '\bthe same (?:two|three|four|five|few|handful of) (?:things|patterns|mistakes|steps|problems)\b'
