# Vale config for /social drafts (Joe, 2026-10-02). Vale finds this file for
# anything under ~/social-drafts. Unlike the film-review config in
# ~/claude-skills/.vale.ini, colon and tricolon tells stay ON here.
StylesPath = /Users/joekarlsson/.vale/styles
MinAlertLevel = warning
Vocab = Social, TechJargon

[*.md]
BasedOnStyles = Vale, JoeKarlsson, ai-tells, Slop, write-good
ai-tells.VerbTricolon = warning
ai-tells.VerbTricolonDensity = warning
Slop.Tricolon = warning
write-good.EPrime = NO
write-good.So = NO
write-good.Passive = NO
write-good.Weasel = NO
write-good.TooWordy = NO
write-good.ThereIs = NO
# Headings in the drafts file are structure (## LinkedIn, ### 1), not prose
Slop.Headers = NO
ai-tells.ExplainerHeadings = NO
ai-tells.AnnouncementHeadings = NO
ai-tells.MarketingHeadings = NO
# Posts are about people (a rep asks, a manager sees); the rule is for AI docs
ai-tells.AnthropomorphicCognition = NO
